<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <title>Bingo</title>

    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

<div class="app">

    <h1>BINGO</h1>

    <div id="status">
        Tap any box to place 1
    </div>

    <div id="board" class="board"></div>

    <div id="currentNumber" class="current-number">
        -
    </div>

    <!-- Setup Buttons -->
    <div id="setupButtons" class="buttons">

        <button id="undoButton">
            Undo
        </button>

        <button id="startButton" disabled>
            Start
        </button>

    </div>

    <!-- Game Button -->
    <div id="gameButtons" class="buttons hidden">

        <button id="resetLogicButton" class="reset">
            Reset Logic
        </button>

    </div>

    <div id="message"></div>

</div>

<script src="js/scripts.js"></script>

</body>
</html>
